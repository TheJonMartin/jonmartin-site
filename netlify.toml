# fourlaws-thejonmartin is a 301 splat only. It is linked to this repo, so
# Netlify was building Deploy Previews of the Astro app there and failing
# (build script exit 2). Skip those previews. jonmartin-mvp still builds.
# Exit 0 skips the build. Exit 1 continues it.
[context.deploy-preview]
  ignore = "if [ \"$SITE_NAME\" = \"fourlaws-thejonmartin\" ]; then exit 0; else exit 1; fi"

# Security headers. Netlify applies every rule whose path matches, so /admin/*
# gets both blocks. The enforced CSP only sets framing/base/object/form rules;
# script/style/connect rules are Report-Only (browser console warnings, nothing
# blocked) until they've been checked on a deploy preview.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; font-src 'self' data:; frame-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; connect-src 'self' https://api.github.com https://api.netlify.com https://unpkg.com; font-src 'self' data: https://unpkg.com; frame-src 'self' blob:"
