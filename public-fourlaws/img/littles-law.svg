<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig8title fig8desc">
<title id="fig8title">Little's Law: cycle time equals work in progress over throughput</title>
<desc id="fig8desc">The formula W equals L over lambda, shown large. Two callouts point down from L and lambda: reduce work in progress on the left, increase throughput on the right — the only two levers that move cycle time.</desc>

<!-- inline slash notation rather than a stacked fraction bar: matches the exact
     form "W = L / λ" used in the prose, and keeps L and λ as two distinct,
     separately-positioned glyphs so the lever callouts below can point at each
     one individually. -->
<text x="200" y="180" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="56" fill="#4A3352">W</text>
<text x="255" y="180" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="56" fill="#4A3352">=</text>
<text x="320" y="180" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="56" fill="#4A3352">L</text>
<text x="365" y="180" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="56" fill="#4A3352">/</text>
<text x="425" y="180" text-anchor="middle" font-family="Courier New, Courier, monospace" font-weight="bold" font-size="56" fill="#4A3352">λ</text>

<line x1="320" y1="200" x2="230" y2="250" stroke="#7C9473" stroke-width="2"/>
<line x1="425" y1="200" x2="470" y2="250" stroke="#7C9473" stroke-width="2"/>

<rect x="110" y="250" width="240" height="70" rx="6" fill="#FAF6EF" stroke="#7C9473" stroke-width="1.75"/>
<text x="230" y="278" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="0.5" fill="#7C9473">REDUCE WORK IN PROGRESS</text>
<text x="230" y="300" text-anchor="middle" font-family="Calibri, Carlito, sans-serif" font-style="italic" font-size="11" fill="#6B6762">cap how much is in flight</text>

<rect x="350" y="250" width="240" height="70" rx="6" fill="#FAF6EF" stroke="#7C9473" stroke-width="1.75"/>
<text x="470" y="278" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="0.5" fill="#7C9473">INCREASE THROUGHPUT</text>
<text x="470" y="300" text-anchor="middle" font-family="Calibri, Carlito, sans-serif" font-style="italic" font-size="11" fill="#6B6762">raise completion, not arrivals</text>
</svg>
