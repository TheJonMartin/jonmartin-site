<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig9title fig9desc">
<title id="fig9title">Kingman's formula: wait time against utilization</title>
<desc id="fig9desc">Two curves of wait time against utilization, both shaped like U over one minus U, rising steeply as utilization nears 100 percent. The mustard curve, representing high variability, rises far more violently than the sage curve, representing low variability. A shaded band marks the last 10 to 15 percent of utilization, where nearly all the danger lives.</desc>

<text x="90" y="60" font-family="Courier New, Courier, monospace" font-size="11" fill="#7C9473">— LOW VARIABILITY</text>
<text x="90" y="80" font-family="Courier New, Courier, monospace" font-size="11" fill="#E8A93B">— HIGH VARIABILITY</text>

<rect x="590" y="40" width="60" height="340" fill="#DBD7D1" opacity="0.6"/>
<text x="620" y="55" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="9" letter-spacing="0.5" fill="#6B6762">LAST 10–15%</text>

<line x1="70" y1="380" x2="650" y2="380" stroke="#2E2A26" stroke-width="1.25"/>
<line x1="70" y1="380" x2="70" y2="40" stroke="#2E2A26" stroke-width="1.25"/>
<text x="360" y="410" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" letter-spacing="1" fill="#6B6762">UTILIZATION →</text>
<text x="30" y="210" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" letter-spacing="1" fill="#6B6762" transform="rotate(-90 30 210)">WAIT TIME →</text>

