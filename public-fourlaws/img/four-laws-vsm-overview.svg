<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig0title fig0desc">
<title id="fig0title">The four laws, and where Beer's Viable System Model fits</title>
<desc id="fig0desc">A central system node with four laws arranged around it — Ashby's Law, Conway's Law, Brooks's Law, and the Reverse Conway Maneuver — each connected to the center. The Reverse Conway node is haloed to show it is the lever that puts the other three into practice. A large dashed ring around the whole diagram represents Beer's Viable System Model, the framework that integrates all four.</desc>

<text x="380" y="45" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12.5" letter-spacing="1.5" fill="#7C9473">BEER'S VIABLE SYSTEM MODEL — INTEGRATES ALL FOUR</text>

<circle cx="380" cy="285" r="235" fill="none" stroke="#7C9473" stroke-width="1.75" stroke-dasharray="7 6"/>

<!-- connecting lines from center to each node, drawn first so nodes overlay the ends -->
<line x1="380" y1="285" x2="380" y2="140" stroke="#4A3352" stroke-width="1.5"/>
<line x1="380" y1="285" x2="600" y2="285" stroke="#4A3352" stroke-width="1.5"/>
<line x1="380" y1="285" x2="380" y2="430" stroke="#4A3352" stroke-width="1.5"/>
<line x1="380" y1="285" x2="160" y2="285" stroke="#E8A93B" stroke-width="1.75"/>

<!-- center node -->
<circle cx="380" cy="285" r="15" fill="#4A3352"/>
<text x="380" y="315" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11" letter-spacing="1" fill="#4A3352">COMPLEX SYSTEM</text>

<!-- Ashby (top) -->
<rect x="305" y="105" width="150" height="38" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="1.5"/>
<text x="380" y="129" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="0.5" fill="#4A3352">ASHBY'S LAW</text>

<!-- Conway (right) -->
<rect x="600" y="266" width="150" height="38" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="1.5"/>
<text x="675" y="290" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="0.5" fill="#4A3352">CONWAY'S LAW</text>

<!-- Brooks (bottom) -->
<rect x="305" y="430" width="150" height="38" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="1.5"/>
<text x="380" y="454" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="0.5" fill="#4A3352">BROOKS'S LAW</text>

<!-- Reverse Conway (left) — the lever, single mustard halo -->
<rect x="6" y="264" width="158" height="42" rx="6" fill="none" stroke="#E8A93B" stroke-width="2.5" opacity="0.55"/>
<rect x="10" y="266" width="150" height="38" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="1.5"/>
<text x="85" y="290" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11.5" letter-spacing="0.5" fill="#4A3352">REVERSE CONWAY</text>
<text x="85" y="330" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10" letter-spacing="0.5" fill="#E8A93B">THE LEVER</text>
</svg>
