<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig5title fig5desc">
<title id="fig5title">Ashby, Conway, and Brooks as a triangle, integrated by Reverse Conway</title>
<desc id="fig5desc">Ashby's Law, Conway's Law, and Brooks's Law form the three corners of a triangle, each edge labeled with the section that explains that pairwise interaction. A mustard node at the center, the Reverse Conway Maneuver, connects to all three corners as the lever that integrates them.</desc>

