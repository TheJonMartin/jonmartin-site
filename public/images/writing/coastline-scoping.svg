  <!-- legend -->
  <rect x="520" y="120" width="212" height="78" fill="#FAF6EF" stroke="#4A3352" stroke-width="1"/>
  <line x1="536" y1="144" x2="574" y2="144" stroke="#E8A93B" stroke-width="5" stroke-linecap="round"/>
  <text x="586" y="148" font-family="Calibri, 'Segoe UI', sans-serif" font-size="13" fill="#2E2A26">Ruler A — L2</text>
  <line x1="536" y1="172" x2="574" y2="172" stroke="#7C9473" stroke-width="2.4" stroke-linecap="round"/>
  <text x="586" y="176" font-family="Calibri, 'Segoe UI', sans-serif" font-size="13" fill="#2E2A26">Ruler B — L2 + L3</text>

  <text x="400" y="268" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="13" fill="#4A3352" text-anchor="middle">ISLAND</text>
  <text x="400" y="286" font-family="Calibri, 'Segoe UI', sans-serif" font-size="11" fill="#2E2A26" text-anchor="middle">L0 outcome</text>

  <text x="48" y="464" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#4A3352">Same shore. Different sticks. Two lengths.</text>
  <text x="752" y="484" font-family="'Courier New', monospace" font-size="11" fill="#7C9473" text-anchor="end">PUBLISH THE RULER WITH THE NUMBER</text>
</svg>
