    <circle cx="470" cy="186" r="5"/>
    <circle cx="580" cy="268" r="5"/>
    <circle cx="620" cy="360" r="5"/>
    <circle cx="430" cy="398" r="5"/>
    <circle cx="230" cy="348" r="5"/>
  </g>

