<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#FAF6EF"/>
  <text x="48" y="52" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="26" fill="#4A3352">The Reset Is the Project</text>
  <text x="48" y="76" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#7C9473">Signed scope and remembered scope are not the same document.</text>
  <line x1="48" y1="92" x2="752" y2="92" stroke="#4A3352" stroke-width="1"/>
  <rect x="48" y="112" width="340" height="196" fill="#E4E9DC" stroke="#4A3352" stroke-width="1"/>
  <text x="64" y="144" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#4A3352">Signed</text>
  <text x="64" y="172" font-family="Calibri, 'Segoe UI', sans-serif" font-size="15" fill="#2E2A26">Confirmed L2 requirements.</text>
  <text x="64" y="196" font-family="Calibri, 'Segoe UI', sans-serif" font-size="15" fill="#2E2A26">Named Responsible.</text>
  <text x="64" y="220" font-family="Calibri, 'Segoe UI', sans-serif" font-size="15" fill="#2E2A26">A list you can point at.</text>
  <text x="64" y="256" font-family="'Courier New', monospace" font-size="12" fill="#7C9473">60% OF THE PICTURE</text>
  <rect x="412" y="112" width="340" height="196" fill="#EDE6D9" stroke="#4A3352" stroke-width="1"/>
  <text x="428" y="144" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#4A3352">Remembered</text>
  <text x="428" y="172" font-family="Calibri, 'Segoe UI', sans-serif" font-size="15" fill="#2E2A26">The full original dream.</text>
  <text x="428" y="196" font-family="Calibri, 'Segoe UI', sans-serif" font-size="15" fill="#2E2A26">Edge cases in Slack.</text>
  <text x="428" y="220" font-family="Calibri, 'Segoe UI', sans-serif" font-size="15" fill="#2E2A26">"While we're in there."</text>
  <text x="428" y="256" font-family="'Courier New', monospace" font-size="12" fill="#7C9473">100% OF THE PICTURE</text>
  <rect x="44" y="328" width="712" height="88" fill="#F3E2B8" stroke="#E8A93B" stroke-width="3"/>
  <text x="64" y="362" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="18" fill="#4A3352">The gap is the reset</text>
  <text x="64" y="390" font-family="Calibri, 'Segoe UI', sans-serif" font-size="15" fill="#2E2A26">Work is not paused. It is replaced. Write the new L2 requirement or you are restarting.</text>
  <text x="752" y="456" font-family="'Courier New', monospace" font-size="11" fill="#7C9473" text-anchor="end">NO BUILD AGAINST A REQUIREMENT YOU CANNOT POINT AT</text>
</svg>
