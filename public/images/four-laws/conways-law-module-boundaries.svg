<svg viewBox="0 0 760 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig2title fig2desc">
<title id="fig2title">Conway's Law: communication ties become module boundaries</title>
<desc id="fig2desc">Two teams, each internally densely connected, joined by only one thin cross-team tie. Below, the resulting system is drawn as two modules with a gap between them at the exact same position as the thin tie — the seam in communication becomes the seam in architecture.</desc>

<text x="190" y="25" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="1.5" fill="#4A3352">TEAM A</text>
<text x="570" y="25" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="1.5" fill="#4A3352">TEAM B</text>

<!-- the seam: one continuous line running through both halves, starting below the "ONE THIN TIE" label so it doesn't cut through the text -->
<line x1="380" y1="98" x2="380" y2="440" stroke="#7C9473" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- Team A dense mesh: 4 nodes, all 6 pairs connected -->
<g stroke="#6B6762" stroke-width="1.25">
  <line x1="150" y1="100" x2="230" y2="100"/>
  <line x1="150" y1="100" x2="150" y2="160"/>
  <line x1="150" y1="100" x2="230" y2="160"/>
  <line x1="230" y1="100" x2="150" y2="160"/>
  <line x1="230" y1="100" x2="230" y2="160"/>
  <line x1="150" y1="160" x2="230" y2="160"/>
</g>
<circle cx="150" cy="100" r="8" fill="#4A3352"/>
<circle cx="230" cy="100" r="8" fill="#4A3352"/>
<circle cx="150" cy="160" r="8" fill="#4A3352"/>
<circle cx="230" cy="160" r="8" fill="#4A3352"/>

<!-- Team B dense mesh -->
<g stroke="#6B6762" stroke-width="1.25">
  <line x1="530" y1="100" x2="610" y2="100"/>
  <line x1="530" y1="100" x2="530" y2="160"/>
  <line x1="530" y1="100" x2="610" y2="160"/>
  <line x1="610" y1="100" x2="530" y2="160"/>
  <line x1="610" y1="100" x2="610" y2="160"/>
  <line x1="530" y1="160" x2="610" y2="160"/>
</g>
<circle cx="530" cy="100" r="8" fill="#4A3352"/>
<circle cx="610" cy="100" r="8" fill="#4A3352"/>
<circle cx="530" cy="160" r="8" fill="#4A3352"/>
<circle cx="610" cy="160" r="8" fill="#4A3352"/>

<!-- the one thin cross-team tie — stops just short of the node circles rather than
     running under them, so the dash pattern doesn't leave a stray mark on a node -->
<line x1="240" y1="100" x2="520" y2="100" stroke="#7C9473" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="380" y="88" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10" letter-spacing="0.5" fill="#7C9473">ONE THIN TIE</text>

<!-- resulting modules -->
<rect x="60" y="300" width="290" height="120" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="2"/>
<rect x="410" y="300" width="290" height="120" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="2"/>
<text x="205" y="365" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="1" fill="#4A3352">MODULE A</text>
<text x="555" y="365" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="1" fill="#4A3352">MODULE B</text>
<text x="380" y="460" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10" letter-spacing="0.5" fill="#7C9473">THE SEAM</text>
</svg>
