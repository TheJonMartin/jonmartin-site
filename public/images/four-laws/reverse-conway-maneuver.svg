<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig4title fig4desc">
<title id="fig4title">The Reverse Conway Maneuver: architecture first, team second</title>
<desc id="fig4desc">A target architecture of three connected modules is drawn first. A mustard arrow labeled "design the team to match" points from it down to a team structure below, made of three team clusters connected in the exact same pattern — the team boundaries are designed to produce the architecture, not the other way around.</desc>

<text x="160" y="30" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11.5" letter-spacing="1" fill="#4A3352">1 — TARGET ARCHITECTURE</text>

<!-- top: architecture modules -->
<line x1="160" y1="80" x2="380" y2="80" stroke="#4A3352" stroke-width="1.75"/>
<line x1="380" y1="80" x2="600" y2="80" stroke="#4A3352" stroke-width="1.75"/>
<rect x="120" y="60" width="80" height="40" rx="5" fill="#FAF6EF" stroke="#4A3352" stroke-width="2"/>
<rect x="340" y="60" width="80" height="40" rx="5" fill="#FAF6EF" stroke="#4A3352" stroke-width="2"/>
<rect x="560" y="60" width="80" height="40" rx="5" fill="#FAF6EF" stroke="#4A3352" stroke-width="2"/>
<text x="160" y="85" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#4A3352">A</text>
<text x="380" y="85" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#4A3352">B</text>
<text x="600" y="85" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10.5" fill="#4A3352">C</text>

<!-- mirror guides -->
<line x1="160" y1="100" x2="160" y2="322" stroke="#DBD7D1" stroke-width="1.25" stroke-dasharray="4 4"/>
<line x1="380" y1="100" x2="380" y2="322" stroke="#DBD7D1" stroke-width="1.25" stroke-dasharray="4 4"/>
<line x1="600" y1="100" x2="600" y2="322" stroke="#DBD7D1" stroke-width="1.25" stroke-dasharray="4 4"/>

<!-- the maneuver: the one mustard arrow -->
<line x1="380" y1="140" x2="380" y2="230" stroke="#E8A93B" stroke-width="3"/>
<polygon points="380,240 371,222 389,222" fill="#E8A93B"/>
<text x="400" y="190" font-family="Courier New, Courier, monospace" font-size="11.5" letter-spacing="0.5" fill="#E8A93B">DESIGN THE TEAM TO MATCH</text>

<text x="160" y="290" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="11.5" letter-spacing="1" fill="#4A3352">2 — TEAM STRUCTURE</text>

<!-- bottom: team clusters mirroring the architecture connections. Each cluster is a
     tight 3-node triangle with its own internal mesh (same visual language as the
     team clusters in Figure 2), and the inter-cluster lines stop short of the
     cluster radius so they don't cut through the node dots. -->
<line x1="190" y1="345" x2="350" y2="345" stroke="#7C9473" stroke-width="1.75"/>
<line x1="410" y1="345" x2="570" y2="345" stroke="#7C9473" stroke-width="1.75"/>

<!-- Team A cluster -->
<g stroke="#7C9473" stroke-width="1.25">
  <line x1="160" y1="331" x2="146" y2="354"/>
  <line x1="160" y1="331" x2="174" y2="354"/>
  <line x1="146" y1="354" x2="174" y2="354"/>
</g>
<circle cx="160" cy="331" r="7" fill="#7C9473"/>
<circle cx="146" cy="354" r="7" fill="#7C9473"/>
<circle cx="174" cy="354" r="7" fill="#7C9473"/>

<!-- Team B cluster -->
<g stroke="#7C9473" stroke-width="1.25">
  <line x1="380" y1="331" x2="366" y2="354"/>
  <line x1="380" y1="331" x2="394" y2="354"/>
  <line x1="366" y1="354" x2="394" y2="354"/>
</g>
<circle cx="380" cy="331" r="7" fill="#7C9473"/>
<circle cx="366" cy="354" r="7" fill="#7C9473"/>
<circle cx="394" cy="354" r="7" fill="#7C9473"/>

<!-- Team C cluster -->
<g stroke="#7C9473" stroke-width="1.25">
  <line x1="600" y1="331" x2="586" y2="354"/>
  <line x1="600" y1="331" x2="614" y2="354"/>
  <line x1="586" y1="354" x2="614" y2="354"/>
</g>
<circle cx="600" cy="331" r="7" fill="#7C9473"/>
<circle cx="586" cy="354" r="7" fill="#7C9473"/>
<circle cx="614" cy="354" r="7" fill="#7C9473"/>

<text x="160" y="388" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10" fill="#7C9473">TEAM A</text>
<text x="380" y="388" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10" fill="#7C9473">TEAM B</text>
<text x="600" y="388" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10" fill="#7C9473">TEAM C</text>
</svg>
