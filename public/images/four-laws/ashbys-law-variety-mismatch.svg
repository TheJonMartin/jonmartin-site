<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1title fig1desc">
<title id="fig1title">Ashby's Law: a regulator with too little variety</title>
<desc id="fig1desc">Eight varied environment states on the left. A regulator frame in the middle contains only four possible states. Four environment states match a regulator state and flow through as controlled output. The other four arc over the top of the frame and arrive as uncontrolled, unresolved output.</desc>

