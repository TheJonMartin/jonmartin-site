<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig10title fig10desc">
<title id="fig10title">A queue backs up in front of the one constraint</title>
<desc id="fig10desc">Four process stations in a row. The first station has a light queue arriving. The second station, highlighted in mustard as the constraint, has a large backed-up pile of work waiting in front of it. The two stations after it are starved, each with barely any work arriving, because the constraint gates how much can reach them.</desc>

<line x1="165" y1="220" x2="270" y2="220" stroke="#4A3352" stroke-width="1.75"/>
<polygon points="270,220 258,214 258,226" fill="#4A3352"/>
<line x1="365" y1="220" x2="470" y2="220" stroke="#4A3352" stroke-width="1.75"/>
<polygon points="470,220 458,214 458,226" fill="#4A3352"/>
<line x1="565" y1="220" x2="640" y2="220" stroke="#4A3352" stroke-width="1.75"/>
<polygon points="640,220 628,214 628,226" fill="#4A3352"/>

<!-- Station 1 -->
<rect x="75" y="190" width="90" height="60" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="2"/>
<rect x="88" y="163" width="14" height="14" fill="#6B6762" opacity="0.55"/>
<rect x="108" y="163" width="14" height="14" fill="#6B6762" opacity="0.55"/>

<!-- Station 2: THE CONSTRAINT -->
<rect x="285" y="182" width="106" height="76" rx="6" fill="#FAF6EF" stroke="#E8A93B" stroke-width="3.5"/>
<text x="338" y="290" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12" letter-spacing="0.5" fill="#E8A93B">THE CONSTRAINT</text>
<!-- the backed-up pile -->
<g fill="#E8A93B">
  <rect x="252" y="120" width="14" height="14"/>
  <rect x="270" y="120" width="14" height="14"/>
  <rect x="288" y="120" width="14" height="14"/>
  <rect x="261" y="138" width="14" height="14"/>
  <rect x="279" y="138" width="14" height="14"/>
  <rect x="297" y="138" width="14" height="14"/>
  <rect x="252" y="156" width="14" height="14"/>
  <rect x="270" y="156" width="14" height="14"/>
  <rect x="288" y="156" width="14" height="14"/>
</g>
<text x="300" y="105" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="10" letter-spacing="0.5" fill="#E8A93B">QUEUE BACKS UP ONLY HERE</text>

<!-- Station 3: starved -->
<rect x="475" y="190" width="90" height="60" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="2" opacity="0.7"/>
<rect x="510" y="163" width="14" height="14" fill="#6B6762" opacity="0.35"/>

<!-- Station 4: starved -->
<rect x="650" y="190" width="90" height="60" rx="6" fill="#FAF6EF" stroke="#4A3352" stroke-width="2" opacity="0.7"/>
<rect x="685" y="163" width="14" height="14" fill="#6B6762" opacity="0.35"/>
</svg>
