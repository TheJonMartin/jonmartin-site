# Dependabot version updates (THE-139). Weekly, grouped, small PR limit so
# Actions minutes and review load stay low. Security alerts/updates are a
# repo setting, not this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      npm-patch-and-minor:
        update-types: ["patch", "minor"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: America/New_York
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
