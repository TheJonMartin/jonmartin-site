name: Weekly SEO & AEO scan

on:
  schedule:
    # 13:00 UTC Monday — mid-morning US Central. Adjust to taste; cron is UTC.
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # No install scripts: nothing in the scan needs them, and a hijacked
      # dependency cannot run code at install time with the issues token around.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Scan thejonmartin.com
        run: npm run seo-scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
